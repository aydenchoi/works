<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayden · 작업물</title>
  <meta name="description" content="직접 만들고 있는 앱과 서비스를 모아 둔 포트폴리오입니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="eyebrow">Portfolio</p>
      <h1 id="name">Ayden</h1>
      <p class="intro" id="intro"></p>
      <nav class="profile-links" id="profile-links" aria-label="프로필 링크"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <p class="count" id="count" aria-live="polite"></p>
      <div class="filters" id="filters" role="group" aria-label="태그로 거르기"></div>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>아직 올린 작업물이 없습니다.</p>
  </main>

  <footer class="wrap foot">
    <span id="foot-name">Ayden</span> · <span id="year"></span>
  </footer>

  <script src="works.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
